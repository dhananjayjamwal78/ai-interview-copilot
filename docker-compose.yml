services:
  db:
    image: postgres:16-alpine
    container_name: ai_interview_copilot_db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ai_interview_copilot}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-ai_interview_copilot}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    container_name: ai_interview_copilot_ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - app_network
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    container_name: ai_interview_copilot_backend
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@db:5432/ai_interview_copilot}
      POSTGRES_HOST: ${POSTGRES_HOST:-db}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_DB: ${POSTGRES_DB:-ai_interview_copilot}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      MODEL_PROVIDER: ${MODEL_PROVIDER:-ollama}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      OLLAMA_CHAT_MODEL: ${OLLAMA_CHAT_MODEL:-llama3.2:3b}
      OLLAMA_EMBED_MODEL: ${OLLAMA_EMBED_MODEL:-nomic-embed-text}
      OLLAMA_REQUEST_TIMEOUT_SECONDS: ${OLLAMA_REQUEST_TIMEOUT_SECONDS:-180}
      CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS:-http://localhost:8501,http://127.0.0.1:8501}
      ENABLE_DOCS: ${ENABLE_DOCS:-true}
      ENABLE_OPENAPI: ${ENABLE_OPENAPI:-true}
      ENABLE_REDOC: ${ENABLE_REDOC:-false}
      RUN_RELOAD: ${RUN_RELOAD:-true}
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    command: >
      sh -c "if [ \"$${RUN_RELOAD}\" = \"true\" ]; then
      python -m uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload;
      else
      python -m uvicorn app.main:app --host 0.0.0.0 --port 8000;
      fi"
    depends_on:
      db:
        condition: service_healthy
      ollama:
        condition: service_started
    volumes:
      - ./backend/app:/app/app
      - ./backend/tests:/app/tests
      - ./backend/storage:/app/storage
    networks:
      - app_network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz')"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    container_name: ai_interview_copilot_frontend
    environment:
      BACKEND_URL: ${BACKEND_URL:-http://backend:8000}
      BACKEND_BROWSER_URL: ${BACKEND_BROWSER_URL:-http://localhost:8000}
      API_TIMEOUT_SECONDS: ${API_TIMEOUT_SECONDS:-180}
    ports:
      - "${FRONTEND_PORT:-8501}:8501"
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - ./frontend/app.py:/app/app.py
      - ./frontend/utils:/app/utils
    networks:
      - app_network
    restart: unless-stopped

volumes:
  postgres_data:
  ollama_data:

networks:
  app_network:
    driver: bridge
