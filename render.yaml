services:
  - type: web
    name: ai-interview-copilot-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT
    plan: free
    healthCheckPath: /readyz
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ai-interview-copilot-db
          property: connectionString
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: RUN_RELOAD
        value: "false"
      - key: ENABLE_DOCS
        value: "true"
      - key: ENABLE_OPENAPI
        value: "true"
      - key: ENABLE_REDOC
        value: "false"
      - key: MODEL_PROVIDER
        value: huggingface
      - key: HF_CHAT_MODEL
        value: google/gemma-2-2b-it
      - key: HF_BASE_URL
        value: https://router.huggingface.co/v1/chat/completions
      - key: HF_REQUEST_TIMEOUT_SECONDS
        value: "180"
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "60"
      - key: CORS_ALLOW_ORIGINS
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: HF_API_TOKEN
        sync: false

databases:
  - name: ai-interview-copilot-db
    databaseName: ai_interview_copilot
    user: ai_interview_copilot
    plan: free
